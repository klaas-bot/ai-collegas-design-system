<svg viewBox="0 0 182 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <!-- AI — orange -->
  <text x="0" y="17" font-size="30" font-weight="700" fill="#f97316" dominant-baseline="central" letter-spacing="-0.025em">AI</text>
